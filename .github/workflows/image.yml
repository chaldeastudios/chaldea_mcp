# Builds this MCP server's image and publishes it to this repository's
# GitHub Container Registry.
#
# Why: Railway's GitHub connection on this account cannot pull from any
# repository here — a push to main does not trigger a redeploy, which is
# the exact problem this workflow exists to route around (see the Odoo
# service in the odoo-mcp-hackathon project, which hit the same wall and
# was moved to this same pattern first). A container image needs no
# GitHub link at all: Railway pulls it straight from the registry.
name: MCP server image

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: mcp-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chaldea-mcp:latest
            ghcr.io/${{ github.repository_owner }}/chaldea-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Where it landed
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/chaldea-mcp:latest"
          echo "ghcr.io/${{ github.repository_owner }}/chaldea-mcp:${{ github.sha }}"
